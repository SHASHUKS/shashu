<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, initial-scale=0.35, maximum-scale=3.0, user-scalable=yes">
  <title>Welcome - Railways AayusPredict</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
    }

    body {
      background-image: url('/static/welcome.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Top Navigation Header */
    .header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #0284c7, #0d9488);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    .app-title {
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .app-title span {
      color: #38bdf8;
    }

    /* Moved Down Towards Bottom Tracks To Unblock The Central Train Graphic */
    .hero-container {
      margin-top: auto;
      margin-bottom: 25px;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 20px 40px;
      text-align: center;
      max-width: 780px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .welcome-prefix {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .welcome-main {
      background: linear-gradient(135deg, #38bdf8 0%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.9));
    }

    .sub-text {
      color: #cbd5e1;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    /* Bottom Button Area */
    .footer-bar {
      width: 100%;
      padding: 25px 20px 35px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .get-started-btn {
      background: linear-gradient(135deg, #0284c7, #0d9488);
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 48px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(2, 132, 199, 0.6);
      transition: all 0.3s ease;
      letter-spacing: 1px;
      text-decoration: none;
      display: inline-block;
    }

    .get-started-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.8);
      background: linear-gradient(135deg, #0369a1, #0f766e);
    }

    .get-started-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">RA</div>
      <div class="app-title">Railways <span>AayusPredict</span></div>
    </div>
  </div>

  <!-- Central Title Container Shifted Down -->
  <div class="hero-container">
    <div class="welcome-prefix">Welcome To</div>
    <div class="welcome-main">Indian Railways</div>
    <p class="sub-text">AI-Driven Hardware Predictive Maintenance Platform</p>
  </div>

  <!-- Bottom Get Started Button -->
  <div class="footer-bar">
    <a href="/login" class="get-started-btn">Get Started &rarr;</a>
  </div>

</body>
</html>
