<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Track AI - Indian Railways</title>
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #f8fafc;
            --primary: #1aa19c; /* Updated to Teal Theme */
            --primary-hover: #148581;
        }
        
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            background-color: #0f172a;
            background-image: url("https://images.unsplash.com/photo-1543363363-264f3312c5af?q=80&w=1920&auto=format&fit=crop");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Dark overlay to make text readable over the background image */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        .sidebar {
            width: 250px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 30px;
            color: #2dd4bf; /* Bright Teal for dark backgrounds */
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .sidebar a {
            color: var(--text-color);
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 14px;
        }

        .sidebar a:hover {
            background: rgba(26, 161, 156, 0.5); /* Teal overlay */
            border: 1px solid var(--primary);
            box-shadow: 0 0 10px rgba(26, 161, 156, 0.3);
            transform: translateX(5px);
        }

        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            z-index: 1;
        }

        /* True Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        input, button {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.4);
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(26, 161, 156, 0.5);
        }

        button {
            background: var(--primary);
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button:hover { 
            background: var(--primary-hover); 
            box-shadow: 0 4px 15px rgba(26, 161, 156, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }
        
        th {
            background: rgba(0,0,0,0.4);
            color: #2dd4bf; /* Teal matching sidebar */
        }

        .status-good { color: #10b981; font-weight: bold; }
        .status-warn { color: #f59e0b; font-weight: bold; }
        .status-crit { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    {% if session.get('logged_in') %}
    <div class="sidebar">
        <h2>Smart Track AI</h2>
        <a href="{{ url_for('option') }}">🏠 Main Menu</a>
        <a href="{{ url_for('dashboard') }}">📊 AI Dashboard</a> <!-- Fixed Route -->
        <a href="{{ url_for('scanner') }}">📷 Field Scanner</a>
        <a href="{{ url_for('view_map') }}">🗺️ Geospatial Map</a>
        <a href="{{ url_for('generate') }}">🖨️ Laser QR Gen</a>
        <a href="{{ url_for('activity') }}">⚙️ System Activity</a>
        
        <a href="{{ url_for('logout') }}" style="background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); margin-top: auto;">
            🔓 Secure Logout
        </a>
    </div>
    {% endif %}
    
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
