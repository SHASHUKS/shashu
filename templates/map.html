<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- FORCES MOBILE BROWSERS TO FIT DESKTOP WIDTH SMOOTHLY -->
    <meta name="viewport" content="width=1200, initial-scale=0.3, minimum-scale=0.1, maximum-scale=3.0">
    <title>Live Map - Indian Railways</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100vh;
            width: 100vw;
            min-width: 1200px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
        }

        body { 
            color: #1e293b; 
            position: relative;
        }

        /* --- 100% FULL-SCREEN MAP --- */
        #map { 
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%; 
            height: 100%;
            background: #0f172a; 
            z-index: 1; 
        }

        /* --- LEAFLET ZOOM CONTROLS IN TOP-RIGHT --- */
        .leaflet-top.leaflet-right {
            top: 80px !important;
            right: 20px !important;
        }

        .leaflet-touch .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4) !important;
            border-radius: 12px !important;
            overflow: hidden;
        }

        .leaflet-touch .leaflet-control-zoom a {
            background-color: rgba(15, 23, 42, 0.9) !important;
            color: #2dd4bf !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            font-size: 18px !important;
            font-weight: 800 !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .leaflet-touch .leaflet-control-zoom a:hover {
            background-color: #1e293b !important;
            color: #38bdf8 !important;
        }
        
        /* --- SINGLE ROW FLOATING NAVBAR --- */
        .navbar-container {
            position: fixed;
            top: 16px;
            left: 20px;
            right: 20px;
            z-index: 99999;
        }

        .navbar { 
            background: rgba(15, 23, 42, 0.92); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px; 
            padding: 10px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            gap: 16px;
            width: 100%;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .navbar-brand span { 
            font-size: 16px; 
            font-weight: 800; 
            color: #ffffff; 
            letter-spacing: 0.5px;
        }

        .navbar-brand small {
            color: #2dd4bf;
            font-weight: 800;
        }

        /* Search Box */
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 2px 6px 2px 14px;
            flex-grow: 1;
            max-width: 380px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .search-box:focus-within {
            border-color: #2dd4bf;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(45, 212, 191, 0.3);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .search-box input::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        .search-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .search-btn:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        /* Nav Buttons */
        .nav-buttons { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            flex-shrink: 0;
        }

        .btn { 
            padding: 8px 18px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            text-decoration: none; 
            color: white; 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease; 
            white-space: nowrap;
            min-height: 36px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: linear-gradient(135deg, #059669, #047857); } 
        .btn-orange { background: linear-gradient(135deg, #ea580c, #c2410c); } 
        .btn-teal { background: linear-gradient(135deg, #0d9488, #0f766e); } 
        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); } 
        .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); } 

        .popup-content { font-family: 'Inter', sans-serif; padding: 4px; }
        .popup-title { font-weight: 800; color: #1e3a8a; font-size: 15px; margin-bottom: 6px; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px;}
        .popup-status { font-weight: 800; margin-bottom: 5px; font-size: 13px;}
        .status-good { color: #006600; } 
        .status-critical { color: #990000; }
        .popup-details { font-size: 12px; color: #475569; line-height: 1.5;}
        .picking-location { cursor: crosshair !important; }

        /* --- FIXED BOTTOM LEGEND ANCHORED VIA VIEWPORT UNITS (vh/vw) --- */
        .map-legend {
            position: fixed !important;
            bottom: 4vh !important;
            left: 20px !important;
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 16px 22px !important;
            border-radius: 20px !important;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8) !important;
            z-index: 99999 !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 12px !important;
            min-width: 240px !important;
            pointer-events: auto !important;
        }

        .legend-title { 
            font-weight: 800 !important; 
            color: #2dd4bf !important; 
            font-size: 13px !important; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important; 
            padding-bottom: 8px !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.8px !important; 
        }
        
        .legend-item { 
            display: flex !important; 
            align-items: center !important; 
            gap: 12px !important; 
            font-size: 15px !important; 
            font-weight: 700 !important; 
            color: #ffffff !important; 
            cursor: pointer !important; 
            transition: all 0.2s ease !important; 
            user-select: none !important; 
            padding: 6px 8px !important; 
            border-radius: 8px !important;
        }
        .legend-item:hover { background-color: rgba(255, 255, 255, 0.15) !important; }
        .legend-item.disabled { opacity: 0.35 !important; filter: grayscale(100%) !important; }
        
        .legend-dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
        .dot-blue { background-color: #38bdf8; border: 2.5px solid #ffffff; }
        
        .custom-pin { background: none; border: none; }
    </style>
</head>
<body>

    <!-- SAFE BACKEND VARIABLE RESOLUTION -->
    {% set map_data = items if (items is defined and items is not none) else (assets if (assets is defined and assets is not none) else []) %}

    <!-- 100% FULL-SCREEN MAP CONTAINER -->
    <div id="map"></div>

    <!-- FLOATING GLASS NAVBAR -->
    <div class="navbar-container" id="navContainer">
        <div class="navbar">
            <div class="navbar-brand">
                <span>📍 Asset Map <small>AI</small></span>
            </div>

            <!-- SEARCH BAR IN NAVBAR -->
            <div class="search-box">
                <input type="text" id="mapSearchInput" placeholder="Search City or Lat, Long..." onkeypress="if(event.key==='Enter') searchLocation();">
                <button class="search-btn" onclick="searchLocation()">🔍 Search</button>
            </div>
            
            <div class="nav-buttons">
                <a href="/scanner" class="btn btn-green">📷 Scan</a>
                <button onclick="locateMe()" class="btn btn-orange">📍 GPS</button>
                <button id="changeLocationBtn" onclick="toggleLocationSelect()" class="btn btn-teal">✏️ Pin</button>
                <a href="/dashboard" class="btn btn-blue">📊 Dash</a>
                <a href="/option" class="btn btn-purple">🏠 Menu</a>
            </div>
        </div>
    </div>
    
    <!-- ALWAYS VISIBLE FILTER STATUS CARD -->
    <div class="map-legend">
        <div class="legend-title">FILTER STATUS</div>
        
        <div class="legend-item" id="legend-good" onclick="setFilter('good')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.4));"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#10b981" stroke="#ffffff" stroke-width="2"/></svg>
            Good Assets
        </div>
        
        <div class="legend-item" id="legend-critical" onclick="setFilter('critical')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.4));"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#ef4444" stroke="#ffffff" stroke-width="2"/></svg>
            Critical Assets
        </div>
        
        <div class="legend-item" style="cursor: default; pointer-events: none; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.2);">
            <span class="legend-dot dot-blue"></span>
            Your Position
        </div>
    </div>

    <script>
        const railwayZones = [
            { name: "Central Railway", hq: "Mumbai (CSMT)", lat: 18.9401, lng: 72.8353 },
            { name: "Eastern Railway", hq: "Kolkata", lat: 22.5726, lng: 88.3639 },
            { name: "East Central Railway", hq: "Hajipur", lat: 25.6804, lng: 85.2203 },
            { name: "East Coast Railway", hq: "Bhubaneswar", lat: 20.2961, lng: 85.8245 },
            { name: "Northern Railway", hq: "New Delhi", lat: 28.6139, lng: 77.2090 },
            { name: "North Central Railway", hq: "Prayagraj", lat: 25.4358, lng: 81.8463 },
            { name: "North Eastern Railway", hq: "Gorakhpur", lat: 26.7606, lng: 83.3732 },
            { name: "Northeast Frontier Railway", hq: "Guwahati", lat: 26.1445, lng: 91.7362 },
            { name: "North Western Railway", hq: "Jaipur", lat: 26.9124, lng: 75.7873 },
            { name: "Southern Railway", hq: "Chennai Central", lat: 13.0827, lng: 80.2707 },
            { name: "South Central Railway", hq: "Secunderabad", lat: 17.4399, lng: 78.4983 },
            { name: "South Eastern Railway", hq: "Kolkata", lat: 22.5458, lng: 88.3036 },
            { name: "South East Central Railway", hq: "Bilaspur", lat: 22.0797, lng: 82.1409 },
            { name: "South Western Railway", hq: "Hubballi", lat: 15.3647, lng: 75.1240 },
            { name: "Western Railway", hq: "Mumbai", lat: 18.9322, lng: 72.8264 },
            { name: "West Central Railway", hq: "Jabalpur", lat: 23.1815, lng: 79.9864 },
            { name: "South Coast Railway", hq: "Visakhapatnam", lat: 17.6868, lng: 83.2185 },
            { name: "Konkan Railway", hq: "Navi Mumbai", lat: 19.0330, lng: 73.0297 }
        ];

        var map = L.map('map', { zoomControl: false }).setView([20.5937, 78.9629], 5); 
        L.control.zoom({ position: 'topright' }).addTo(map);
        
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            attribution: '&copy; Google Maps',
            maxZoom: 20
        }).addTo(map);

        var goodLayerGroup = L.layerGroup().addTo(map);
        var criticalLayerGroup = L.layerGroup().addTo(map);
        var currentFilter = 'all';

        var rawData = {{ map_data | tojson | safe }};
        var bounds = [];

        function createPinIcon(color) {
            var svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="${color}" stroke="#ffffff" stroke-width="2"/></svg>`;
            return L.divIcon({
                className: 'custom-pin',
                html: `<div style="filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.8)); transform: scale(1.05);">${svgIcon}</div>`,
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [0, -36]
            });
        }

        function createCustomDot(color, borderColor) {
            return L.divIcon({
                className: 'custom-pin',
                html: `<div style="background-color:${color}; width:24px; height:24px; border-radius:50%; border:3px solid ${borderColor}; box-shadow: 0 4px 10px rgba(0,0,0,0.8);"></div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            });
        }

        var goodIcon = createPinIcon('#10b981');
        var criticalIcon = createPinIcon('#ef4444');
        var userIcon = createCustomDot('#38bdf8', '#ffffff');

        (rawData || []).forEach(function(asset, index) {
            let lat = 20.5937;
            let lng = 78.9629;
            let hasValidCoords = false;
            let displayCoords = asset.gps_location;

            if (asset.gps_location && asset.gps_location !== 'Unknown' && asset.gps_location !== 'Pending Scan') {
                var coords = asset.gps_location.split(',');
                if (coords.length === 2) {
                    let parsedLat = parseFloat(coords[0].trim());
                    let parsedLng = parseFloat(coords[1].trim());
                    if (!isNaN(parsedLat) && !isNaN(parsedLng)) {
                        lat = parsedLat;
                        lng = parsedLng;
                        hasValidCoords = true;
                    }
                }
            }

            if (asset.track_load && asset.track_load !== 'Pending Scan') {
                if (hasValidCoords) {
                    lat += (Math.random() - 0.5) * 0.0005;
                    lng += (Math.random() - 0.5) * 0.0005;
                } else {
                    lat += (index * 0.05); 
                    lng += (index * 0.05);
                }

                var isCritical = (asset.status && asset.status.trim() === 'Critical');
                var iconToUse = isCritical ? criticalIcon : goodIcon;
                var displayStatus = isCritical ? 'Critical' : 'Good';
                var statusClass = isCritical ? 'status-critical' : 'status-good';
                var alloyName = asset.asset_id ? (asset.asset_id.split('-')[2] || 'Unknown') : 'Unknown';
                var zoneName = asset.scan_zone ? asset.scan_zone.split(' (')[0] : 'Southern Railway';
                
                var popupHTML = `<div class="popup-content">
                    <div class="popup-title">${asset.asset_id}</div>
                    <div class="popup-status ${statusClass}">Status: ${displayStatus}</div>
                    <div class="popup-details">
                        <b>Zone:</b> ${zoneName}<br>
                        <b>RUL:</b> ${asset.predicted_rul} Years<br>
                        <b>Alloy:</b> ${alloyName}<br>
                        <b>Location:</b> ${displayCoords}
                    </div>
                </div>`;
                
                var marker = L.marker([lat, lng], {icon: iconToUse}).bindPopup(popupHTML);
                if (isCritical) { marker.addTo(criticalLayerGroup); } else { marker.addTo(goodLayerGroup); }
                bounds.push([lat, lng]);
            }
        });

        function setFilter(type) {
            var goodBtn = document.getElementById('legend-good');
            var criticalBtn = document.getElementById('legend-critical');

            if (currentFilter === type) {
                currentFilter = 'all';
                map.addLayer(goodLayerGroup);
                map.addLayer(criticalLayerGroup);
                goodBtn.classList.remove('disabled');
                criticalBtn.classList.remove('disabled');
            } else {
                currentFilter = type;
                if (type === 'good') {
                    map.addLayer(goodLayerGroup);
                    map.removeLayer(criticalLayerGroup);
                    goodBtn.classList.remove('disabled');
                    criticalBtn.classList.add('disabled');
                } else if (type === 'critical') {
                    map.addLayer(criticalLayerGroup);
                    map.removeLayer(goodLayerGroup);
                    criticalBtn.classList.remove('disabled');
                    goodBtn.classList.add('disabled');
                }
            }
        }

        function findNearestRailwayZone(lat, lng) {
            let nearest = railwayZones[0];
            let minDistance = Infinity;
            railwayZones.forEach(zone => {
                let dist = Math.hypot(zone.lat - lat, zone.lng - lng);
                if (dist < minDistance) {
                    minDistance = dist;
                    nearest = zone;
                }
            });
            return `${nearest.name} (HQ: ${nearest.hq})`;
        }

        var userMarker = null;
        var isSelectingLocation = false;

        function syncLocationToServer(zoneName, lat, lng) {
            fetch('/set_location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    zone: zoneName,
                    gps: lat.toFixed(6) + ", " + lng.toFixed(6)
                })
            }).catch(err => console.error("Sync error:", err));
        }

        function placeUserMarker(lat, lng, label) {
            let zoneName = findNearestRailwayZone(lat, lng);
            if(userMarker) { map.removeLayer(userMarker); }
            userMarker = L.marker([lat, lng], {icon: userIcon, zIndexOffset: 1000}).addTo(map);
            userMarker.bindPopup(`<div class="popup-content"><div class="popup-title" style="color: #1d4ed8;">📍 ${zoneName}</div><div class="popup-details"><b>Pinned Label:</b> ${label}<br><b>Latitude:</b> ${lat.toFixed(6)}<br><b>Longitude:</b> ${lng.toFixed(6)}</div></div>`).openPopup();
            map.setView([lat, lng], 14);

            localStorage.setItem("custom_gps", lat.toFixed(6) + ", " + lng.toFixed(6));
            localStorage.setItem("custom_zone", zoneName);

            syncLocationToServer(zoneName, lat, lng);
        }

        function locateMe() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    placeUserMarker(position.coords.latitude, position.coords.longitude, "Live GPS Position");
                }, function(error) { alert("Please allow location access."); });
            } else { alert("Geolocation is not supported."); }
        }

        function toggleLocationSelect() {
            var btn = document.getElementById("changeLocationBtn");
            if (!isSelectingLocation) {
                isSelectingLocation = true;
                btn.innerHTML = "🎯 Click Map";
                btn.style.background = "#dc2626"; 
                document.getElementById('map').classList.add('picking-location');
            } else {
                isSelectingLocation = false;
                btn.innerHTML = "✏️ Pin";
                btn.style.background = "linear-gradient(135deg, #0d9488, #0f766e)"; 
                document.getElementById('map').classList.remove('picking-location');
            }
        }

        map.on('click', function(e) {
            if (isSelectingLocation) {
                var lat = e.latlng.lat;
                var lng = e.latlng.lng;
                
                placeUserMarker(lat, lng, "Custom Pinned Location");
                
                isSelectingLocation = false;
                var btn = document.getElementById("changeLocationBtn");
                btn.innerHTML = "✏️ Pin";
                btn.style.background = "linear-gradient(135deg, #0d9488, #0f766e)"; 
                document.getElementById('map').classList.remove('picking-location');
            }
        });

        function searchLocation() {
            var query = document.getElementById('mapSearchInput').value.trim();
            if (!query) return;

            var latLngRegex = /^([-+]?\d*\.?\d+)\s*,\s*([-+]?\d*\.?\d+)$/;
            var match = query.match(latLngRegex);

            if (match) {
                var lat = parseFloat(match[1]);
                var lng = parseFloat(match[2]);
                if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                    placeUserMarker(lat, lng, `Searched Coordinates: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
                    return;
                }
            }

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        var lat = parseFloat(data[0].lat);
                        var lng = parseFloat(data[0].lon);
                        var cityLabel = data[0].display_name.split(',')[0];
                        
                        placeUserMarker(lat, lng, `Searched Location: ${cityLabel}`);
                    } else {
                        alert("Location not found. Please enter a valid city or 'Lat, Long' coordinates.");
                    }
                })
                .catch(err => {
                    console.error("Geocoding Search Error:", err);
                    alert("Unable to complete search request. Please check your network connection.");
                });
        }

        function fixMapSize() {
            if (map) {
                setTimeout(function() {
                    map.invalidateSize();
                    if (bounds.length > 0) { map.fitBounds(bounds, {padding: [30, 30]}); }
                }, 100);
            }
        }

        window.addEventListener('resize', fixMapSize);

        document.addEventListener("DOMContentLoaded", function() {
            fixMapSize();
            var savedLocation = localStorage.getItem("custom_gps");
            var savedZone = localStorage.getItem("custom_zone");
            if(savedLocation) {
                var parts = savedLocation.split(',');
                placeUserMarker(parseFloat(parts[0]), parseFloat(parts[1]), savedZone || "Custom Pinned Location");
            }
        });
    </script>
</body>
</html>
