<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu - Smart Track AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        /* --- GLOBAL BODY --- */
        body {
            margin: 0;
            padding: 90px 20px; 
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: url("{{ url_for('static', filename='option.jpeg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            animation: fadeIn 0.8s ease-out forwards;
            position: relative;
            overflow-x: hidden;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 25, 45, 0.15); 
            backdrop-filter: blur(2px); 
            z-index: -1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- TOP RIGHT: LOGOUT BUTTON --- */
        .btn-logout {
            position: absolute;
            top: 25px;
            right: 25px;
            background: linear-gradient(135deg, #ef4444, #b91c1c); 
            color: #ffffff;
            padding: 12px 26px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(220, 38, 38, 0.5); 
            cursor: pointer; 
            font-family: 'Inter', sans-serif;
            z-index: 50;
        }
        .btn-logout:hover {
            background: linear-gradient(135deg, #f87171, #dc2626); 
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.7);
            transform: translateY(-3px);
        }

        /* --- BOTTOM LEFT: MY ACTIVITY BUTTON --- */
        .btn-activity {
            position: absolute;
            bottom: 25px;
            left: 25px;
            background: linear-gradient(135deg, #10b981, #059669); 
            color: #ffffff;
            padding: 12px 26px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.5); 
            cursor: pointer; 
            font-family: 'Inter', sans-serif;
            z-index: 50;
        }
        .btn-activity:hover {
            background: linear-gradient(135deg, #34d399, #10b981); 
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.7);
            transform: translateY(-3px);
        }

        /* --- TITLE --- */
        .page-title {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.9), rgba(15, 23, 42, 0.9)); 
            backdrop-filter: blur(16px);
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            padding: 15px 35px;
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-bottom: 4px solid #1aa19c; 
            letter-spacing: 2px;
            text-transform: uppercase; 
            z-index: 10;
            margin: 0 0 35px 0; 
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
        }

        /* --- STRICT EQUAL-SIZED 2x2 GRID (SLIGHTLY BIGGER) --- */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            grid-auto-rows: 1fr;
            gap: 25px; 
            width: 100%;
            max-width: 650px; 
        }

        /* --- PERFECT SQUARE CARDS --- */
        .card {
            background: rgba(15, 25, 45, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%; 
            height: 100%;
            aspect-ratio: 1 / 1; 
            padding: 18px; 
            border-radius: 20px;
            box-sizing: border-box;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none; 
            cursor: pointer;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px); 
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            border-color: rgba(26, 161, 156, 0.6); 
            background: rgba(25, 40, 70, 0.95);
        }

        .card-img-wrapper {
            width: 100%;
            flex-grow: 1; 
            min-height: 0; 
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        
        .card:hover img {
            transform: scale(1.08); 
        }

        .card h2 {
            color: #ffffff;
            font-size: 16px;
            margin: 14px 0 0 0;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap; 
            width: 100%;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .modal-content {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 350px;
            width: 90%;
        }
        
        .modal-content h2 { color: #333333; margin-top: 0; margin-bottom: 20px; font-size: 20px; font-weight: 800; }
        .modal-actions { display: flex; justify-content: center; gap: 15px; }
        
        .btn {
            padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: none; font-family: 'Inter', sans-serif; flex: 1;
        }
        .btn-red { background-color: #ef4444; color: white; }
        .btn-gray { background-color: #64748b; color: white; }

        /* --- BULLETPROOF MOBILE LAYOUT --- */
        @media (max-width: 700px) {
            body {
                padding: 75px 15px 75px 15px;
                justify-content: center;
            }
            
            .btn-logout { top: 15px; right: 15px; padding: 10px 18px; font-size: 12px; }
            .btn-activity { bottom: 15px; left: 15px; padding: 10px 18px; font-size: 12px; }

            .page-title {
                font-size: 16px;
                padding: 12px 15px;
                letter-spacing: 1px;
                white-space: normal;
                margin-bottom: 25px;
                max-width: 380px;
            }

            .cards-container {
                gap: 15px; 
                max-width: 380px; 
            }

            .card {
                padding: 12px;
                border-radius: 16px;
            }

            .card h2 {
                font-size: 12px; 
                margin: 10px 0 0 0;
            }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- ABSOLUTE POSITIONED CORNER BUTTONS -->
    <button class="btn-logout" onclick="showLogoutModal()">Logout</button>
    <a href="/activity" class="btn-activity">My Activity</a>

    <!-- MAIN CENTER CONTENT -->
    <h1 class="page-title">Predictive Maintenance Menu</h1>

    <!-- 2x2 Grid Layout -->
    <div class="cards-container">
        <a href="/generate" class="card">
            <div class="card-img-wrapper">
                <img src="{{ url_for('static', filename='qr_generator.jpeg') }}" alt="QR Generator">
            </div>
            <h2>Asset QR Gen</h2>
        </a>

        <a href="/scanner" class="card">
            <div class="card-img-wrapper">
                <img src="{{ url_for('static', filename='qr_scanner.jpeg') }}" alt="Field Scanner">
            </div>
            <h2>Field Scanner</h2>
        </a>

        <a href="/dashboard" class="card">
            <div class="card-img-wrapper">
                <img src="{{ url_for('static', filename='dashboard.jpeg') }}" alt="AI Dashboard">
            </div>
            <h2>AI Dashboard</h2>
        </a>

        <a href="/map" class="card">
            <div class="card-img-wrapper">
                <img src="{{ url_for('static', filename='map.jpeg') }}" alt="Geospatial Map">
            </div>
            <h2>Geospatial Map</h2>
        </a>
    </div>

    <!-- Logout Confirmation Modal -->
    <div id="logoutModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Confirm System Logout</h2>
            <p style="color: #666; margin-bottom: 25px; font-size: 14px;">Are you sure you want to end your secure session?</p>
            <div class="modal-actions">
                <button class="btn btn-red" onclick="confirmLogout()">Logout</button>
                <button class="btn btn-gray" onclick="closeLogoutModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        function showLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; }
        function closeLogoutModal() { document.getElementById('logoutModal').style.display = 'none'; }
        function confirmLogout() { window.location.href = "/logout"; }
    </script>

</body>
</html>
